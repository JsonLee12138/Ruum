name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "cliff.toml", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "cliff.toml", "LICENSE"]
  workflow_dispatch:
    inputs:
      include_macos_intel:
        description: "Run slow macOS x86_64 test job on macos-15-intel"
        type: boolean
        required: false
        default: false

# Pull requests run here, so the token can read and nothing more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_rust: ${{ steps.classify.outputs.run_rust }}
      run_macos_bundle: ${{ steps.classify.outputs.run_macos_bundle }}
      run_windows_release_check: ${{ steps.classify.outputs.run_windows_release_check }}
      run_worker: ${{ steps.classify.outputs.run_worker }}
      run_ci_scripts: ${{ steps.classify.outputs.run_ci_scripts }}
      run_macos_intel: ${{ steps.classify.outputs.run_macos_intel }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changes
        id: classify
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INCLUDE_MACOS_INTEL: ${{ inputs.include_macos_intel == true }}
        run: node scripts/ci-classify-changes.mjs

  tooling-test:
    name: Test (Worker & CI scripts)
    needs: changes
    if: needs.changes.outputs.run_worker == 'true' || needs.changes.outputs.run_ci_scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Test CI classifier
        if: needs.changes.outputs.run_ci_scripts == 'true'
        run: node --test scripts/ci-classify-changes.test.mjs

      - name: Test update worker
        if: needs.changes.outputs.run_worker == 'true'
        run: node --test infra/update-worker/tests/worker.test.mjs

  check:
    name: Lint and test
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      # What GPUI links against: windowing (Wayland, X11), input, fonts,
      # and the Vulkan loader.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev

      # Pinned: the lint gate denies clippy::all and ::pedantic, and a newer
      # clippy's new lints are a change to make on purpose, not by surprise.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ruum-${{ runner.os }}-${{ runner.arch }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint
        run: cargo xtask lint

      - name: Test
        run: cargo xtask test

  check-macos:
    name: Lint and test (macOS)
    # Apple silicon. No system libraries to install, and no Metal toolchain
    # either: gpui-kit builds GPUI with runtime shader compilation, so the
    # shaders compile when the app starts, not here.
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ruum-${{ runner.os }}-${{ runner.arch }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint
        run: cargo xtask lint

      - name: Test
        run: cargo xtask test

      # The app bundle, zip, dmg, and pkg, signed ad hoc: catches a broken
      # Info.plist, icon, signature, disk image, or installer package before a
      # release does.
      - name: Bundle
        if: needs.changes.outputs.run_macos_bundle == 'true'
        run: |
          cargo xtask bundle --all
          rm -rf target/release target/bundle

  windows:
    name: Lint and test (Windows)
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      # Check out with the repository's own line endings, as on Linux.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      # Pinned with the Linux job, for the same reason. GPUI needs nothing
      # beyond the Windows SDK the runner already has.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ruum-${{ runner.os }}-${{ runner.arch }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint
        run: cargo xtask lint

      - name: Test
        run: cargo xtask test

      - name: Check embedded executable icon (debug)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --locked -p ruum-app -p ruum-core --bin ruum-gui --bin ruum
          if ($LASTEXITCODE -ne 0) { throw "cargo build (debug) failed" }
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class ExecutableIcons {
              [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
              public static extern uint ExtractIconEx(
                  string file, int index, IntPtr[] large, IntPtr[] small, uint count);
          }
          '@
          $guiExe = (Resolve-Path target/debug/ruum-gui.exe).Path
          if ([ExecutableIcons]::ExtractIconEx($guiExe, -1, $null, $null, 0) -lt 1) {
            throw "ruum-gui.exe (debug) has no embedded icon"
          }
          if (-not (Test-Path -LiteralPath target/debug/ruum.exe -PathType Leaf)) {
            throw "ruum.exe missing from debug output"
          }

      - name: Check embedded executable icon (release)
        if: needs.changes.outputs.run_windows_release_check == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          try {
            cargo build --release --locked -p ruum-app -p ruum-core --bin ruum-gui --bin ruum
            if ($LASTEXITCODE -ne 0) { throw "cargo build (release) failed" }
            Add-Type @'
            using System;
            using System.Runtime.InteropServices;
            public static class ExecutableIcons {
                [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
                public static extern uint ExtractIconEx(
                    string file, int index, IntPtr[] large, IntPtr[] small, uint count);
            }
          '@
            $guiExe = (Resolve-Path target/release/ruum-gui.exe).Path
            if ([ExecutableIcons]::ExtractIconEx($guiExe, -1, $null, $null, 0) -lt 1) {
              throw "ruum-gui.exe (release) has no embedded icon"
            }
            if (-not (Test-Path -LiteralPath target/release/ruum.exe -PathType Leaf)) {
              throw "ruum.exe missing from release output"
            }
          } finally {
            if (Test-Path -LiteralPath target/release) {
              Remove-Item -Recurse -Force -LiteralPath target/release
            }
          }

  # The other half of each release: the same tests on the architectures
  # the release builds for but the jobs above do not run on.
  other-architectures:
    name: Test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux aarch64, runner: ubuntu-24.04-arm }
          - { name: Windows aarch64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ruum-${{ runner.os }}-${{ runner.arch }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo xtask test

  test-macos-intel:
    name: Test (macOS x86_64)
    needs: changes
    if: needs.changes.outputs.run_rust == 'true' && needs.changes.outputs.run_macos_intel == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ruum-${{ runner.os }}-${{ runner.arch }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo xtask test

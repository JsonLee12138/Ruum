name: Release

# Push a tag like v0.9.0 to build and publish a release. The tag must match
# the workspace version in Cargo.toml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.9.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate tag and version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Version
        id: version
        # Through the environment, not spliced into the script: a tag typed
        # into the dispatch form is text, never shell.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Build (Linux ${{ matrix.arch }})
    needs: validate
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runners: their glibc is what the binary
          # needs at least, so building there runs on the most systems.
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: System libraries and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev \
            desktop-file-utils rpm cpio

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo xtask test

      - name: Build
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          cargo xtask portable

      - name: Install nfpm and appimagetool
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          nfpm_arch="x86_64"
          if [ "$ARCH" = "aarch64" ]; then
            nfpm_arch="arm64"
          fi
          mkdir -p "$RUNNER_TEMP/nfpm" "$RUNNER_TEMP/appimage"
          gh release download --repo goreleaser/nfpm \
            --pattern "nfpm_*_Linux_${nfpm_arch}.tar.gz" \
            --pattern "checksums.txt" \
            --dir "$RUNNER_TEMP/nfpm"
          (cd "$RUNNER_TEMP/nfpm" && \
            grep "nfpm_.*_Linux_${nfpm_arch}\.tar\.gz$" checksums.txt \
              | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/nfpm"/nfpm_*_Linux_"${nfpm_arch}".tar.gz \
            -C "$RUNNER_TEMP/nfpm" nfpm
          sudo install -m755 "$RUNNER_TEMP/nfpm/nfpm" /usr/local/bin/nfpm

          gh release download continuous --repo AppImage/appimagetool \
            --pattern "appimagetool-${ARCH}.AppImage" \
            --dir "$RUNNER_TEMP/appimage"
          chmod +x "$RUNNER_TEMP/appimage/appimagetool-${ARCH}.AppImage"

      - name: Package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          name="ruum-$VERSION-$ARCH-linux"
          tar_stage="$RUNNER_TEMP/tar-stage/$name"
          pkg_stage="$RUNNER_TEMP/pkg-stage"
          verify_dir="$RUNNER_TEMP/verify"
          rm -rf dist "$tar_stage" "$pkg_stage" "$verify_dir"
          mkdir -p dist "$tar_stage" "$pkg_stage" "$verify_dir"

          # portable strips before appending; stripping again loses helpers.
          cp target/portable/ruum target/portable/ruum-gui "$tar_stage/"
          cp packaging/install.sh packaging/ruum.desktop.in \
             assets/ruum.svg README.md LICENSE THIRD_PARTY_NOTICES.md \
             "$tar_stage/"
          echo "$VERSION" > "$tar_stage/VERSION"
          tar -C "$RUNNER_TEMP/tar-stage" -czf "dist/$name.tar.gz" "$name"

          cargo xtask package linux-stage \
            --arch "$ARCH" \
            --out "$pkg_stage" \
            --binary target/portable/ruum \
            --gui-binary target/portable/ruum-gui \
            --version "$VERSION"

          desktop-file-validate "$pkg_stage/ruum.desktop"
          desktop-file-validate "$pkg_stage/AppDir/ruum.desktop"

          nfpm package --config "$pkg_stage/nfpm.yaml" \
            --packager deb --target "dist/$name.deb"
          nfpm package --config "$pkg_stage/nfpm.yaml" \
            --packager rpm --target "dist/$name.rpm"

          ARCH="$ARCH" APPIMAGE_EXTRACT_AND_RUN=1 \
            "$RUNNER_TEMP/appimage/appimagetool-${ARCH}.AppImage" \
            "$pkg_stage/AppDir" "dist/$name.AppImage"
          chmod +x "dist/$name.AppImage"

          # Verify the embedded ruum-scan trailer survived all package formats.
          deb_member=$(dpkg-deb --fsys-tarfile "dist/$name.deb" | tar -tf - \
            | grep -E '^(\./)?usr/bin/ruum$' | head -1)
          dpkg-deb --fsys-tarfile "dist/$name.deb" \
            | tar -xOf - "$deb_member" > "$verify_dir/ruum-deb"
          cmp -s target/portable/ruum "$verify_dir/ruum-deb"
          chmod +x "$verify_dir/ruum-deb"
          "$verify_dir/ruum-deb" extract-scanner "$ARCH" "$verify_dir/scan-deb"

          rpm_member=$(rpm2cpio "dist/$name.rpm" | cpio -t 2>/dev/null \
            | grep -E '^(\./)?usr/bin/ruum$' | head -1)
          rpm2cpio "dist/$name.rpm" \
            | cpio -i --to-stdout "$rpm_member" > "$verify_dir/ruum-rpm"
          cmp -s target/portable/ruum "$verify_dir/ruum-rpm"
          chmod +x "$verify_dir/ruum-rpm"
          "$verify_dir/ruum-rpm" extract-scanner "$ARCH" "$verify_dir/scan-rpm"

          (cd "$verify_dir" && APPIMAGE_EXTRACT_AND_RUN=1 \
            "$GITHUB_WORKSPACE/dist/$name.AppImage" \
            --appimage-extract usr/bin/ruum >/dev/null)
          cmp -s target/portable/ruum \
            "$verify_dir/squashfs-root/usr/bin/ruum"
          "$verify_dir/squashfs-root/usr/bin/ruum" \
            extract-scanner "$ARCH" "$verify_dir/scan-appimage"

          rm -rf "$verify_dir" "$tar_stage" "$pkg_stage"

      - name: Attest artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/ruum-${{ needs.validate.outputs.version }}-${{ matrix.arch }}-linux.tar.gz
            dist/ruum-${{ needs.validate.outputs.version }}-${{ matrix.arch }}-linux.deb
            dist/ruum-${{ needs.validate.outputs.version }}-${{ matrix.arch }}-linux.rpm
            dist/ruum-${{ needs.validate.outputs.version }}-${{ matrix.arch }}-linux.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: Build (macOS ${{ matrix.arch }})
    needs: validate
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      signed: ${{ steps.signing_state.outputs.signed }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `xtask bundle` names artifacts after the machine it runs on, so
          # each architecture builds on its own.
          - { runner: macos-15, arch: aarch64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    env:
      # Signing and notarizing happen only when the repository has these
      # secrets; without them the app is signed ad hoc, and a downloaded
      # copy needs quarantine removal or "Open Anyway" once.
      #   MACOS_CERTIFICATE             base64 of the Developer ID .p12
      #   MACOS_CERTIFICATE_PASSWORD    its password
      #   MACOS_SIGN_IDENTITY           "Developer ID Application: Name (TEAMID)"
      #   MACOS_INSTALLER_SIGN_IDENTITY "Developer ID Installer: Name (TEAMID)"
      #   NOTARY_KEY_P8                 base64 of an App Store Connect API key
      #   NOTARY_KEY_ID, NOTARY_ISSUER  that key's ID and issuer
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo xtask test

      # A keychain of its own for the certificate, deleted with the runner.
      - name: Signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild \
            -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Bundle
        id: signing_state
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8"' EXIT
          args=(--all)
          signed=false
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$MACOS_SIGN_IDENTITY" ]; then
            args+=(--sign "$MACOS_SIGN_IDENTITY")
            if [ -n "$MACOS_INSTALLER_SIGN_IDENTITY" ]; then
              args+=(--installer-sign "$MACOS_INSTALLER_SIGN_IDENTITY")
            fi
            if [ -n "$NOTARY_KEY_P8" ]; then
              echo "$NOTARY_KEY_P8" | base64 --decode \
                > "$RUNNER_TEMP/AuthKey.p8"
              export NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"
              args+=(--notarize)
              signed=true
            fi
          fi
          cargo xtask bundle "${args[@]}"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

          mkdir -p dist
          for ext in zip dmg pkg; do
            cp "target/bundle/ruum-$VERSION-$ARCH-macos.$ext" dist/
          done

          hdiutil verify "dist/ruum-$VERSION-$ARCH-macos.dmg"
          pkgutil --expand "dist/ruum-$VERSION-$ARCH-macos.pkg" \
            "$RUNNER_TEMP/pkg-expanded"
          lsbom "$RUNNER_TEMP/pkg-expanded"/*/Bom \
            | grep -q "ruum.app/Contents/MacOS/ruum-gui"
          lsbom "$RUNNER_TEMP/pkg-expanded"/*/Bom \
            | grep -q "ruum.app/Contents/MacOS/ruum"
          rm -rf "$RUNNER_TEMP/pkg-expanded"

          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: Attest artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/ruum-${{ needs.validate.outputs.version }}-${{ matrix.arch }}-macos.zip
            dist/ruum-${{ needs.validate.outputs.version }}-${{ matrix.arch }}-macos.dmg
            dist/ruum-${{ needs.validate.outputs.version }}-${{ matrix.arch }}-macos.pkg

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Build (Windows ${{ matrix.arch }})
    needs: validate
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, arch: x86_64 }
          - { runner: windows-11-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    env:
      # The C runtime linked in, so ruum.exe also runs where the Visual
      # C++ runtime was never installed. For the tests too, so both steps
      # share one build.
      RUSTFLAGS: -C target-feature=+crt-static
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      DOTNET_ROLL_FORWARD: Major
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo xtask test

      - name: Build
        run: cargo build --release --locked -p ruum-app -p ruum-core --bin ruum-gui --bin ruum

      - name: Install WiX and verify Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wixToolDir = Join-Path $env:RUNNER_TEMP "wix-tool"
          if (Test-Path -LiteralPath $wixToolDir) {
            Remove-Item -Recurse -Force -LiteralPath $wixToolDir
          }
          dotnet tool install wix --version 5.0.2 --tool-path $wixToolDir
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install wix 5.0.2 failed with exit code $LASTEXITCODE" }
          $wixExe = Join-Path $wixToolDir "wix.exe"
          if (-not (Test-Path -LiteralPath $wixExe -PathType Leaf)) {
            throw "wix.exe not found at '$wixExe' after installation"
          }
          & $wixExe --version
          if ($LASTEXITCODE -ne 0) { throw "wix --version verification failed with exit code $LASTEXITCODE" }
          "WIX_PATH=$wixExe" >> $env:GITHUB_ENV

          function Get-InnoCandidates {
            $candidates = [System.Collections.Generic.List[string]]::new()
            $seen = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $addCandidate = {
              param([string]$candidatePath)
              if (-not [string]::IsNullOrWhiteSpace($candidatePath)) {
                $trimmed = $candidatePath.Trim().Trim('"')
                if ((Test-Path -LiteralPath $trimmed -PathType Leaf) -and $seen.Add($trimmed)) {
                  $candidates.Add($trimmed)
                }
              }
            }

            foreach ($base in @(${env:ProgramFiles(x86)}, $env:ProgramFiles, ${env:ProgramFiles(Arm)})) {
              if (-not [string]::IsNullOrWhiteSpace($base)) {
                & $addCandidate (Join-Path $base "Inno Setup 6\ISCC.exe")
              }
            }
            if (-not [string]::IsNullOrWhiteSpace($env:LOCALAPPDATA)) {
              & $addCandidate (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe")
            }

            $regPaths = @(
              "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*"
            )
            foreach ($regPath in $regPaths) {
              $parentKey = Split-Path $regPath
              if (-not (Test-Path -LiteralPath $parentKey)) { continue }
              $items = Get-ItemProperty -Path $regPath -ErrorAction SilentlyContinue |
                Where-Object { $_.DisplayName -like "Inno Setup*" }
              foreach ($item in $items) {
                if (-not [string]::IsNullOrWhiteSpace($item.InstallLocation)) {
                  & $addCandidate (Join-Path $item.InstallLocation.Trim().Trim('"') "ISCC.exe")
                }
              }
            }

            $chocoRoots = @("C:\ProgramData\chocolatey\lib\innosetup")
            if (-not [string]::IsNullOrWhiteSpace($env:ChocolateyInstall)) {
              $chocoRoots += Join-Path $env:ChocolateyInstall "lib\innosetup"
            }
            foreach ($chocoRoot in ($chocoRoots | Select-Object -Unique)) {
              if (Test-Path -LiteralPath $chocoRoot) {
                Get-ChildItem -Path $chocoRoot -Filter "ISCC.exe" -Recurse -File -ErrorAction SilentlyContinue |
                  ForEach-Object { & $addCandidate $_.FullName }
              }
            }

            # Last-resort fallback: Chocolatey's bin\ISCC.exe shim reports 0.0.0.0.
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { & $addCandidate $cmd.Source }

            return $candidates.ToArray()
          }

          function ConvertTo-InnoVersion([string]$raw) {
            if ([string]::IsNullOrWhiteSpace($raw)) { return $null }
            $norm = $raw -replace '\s*,\s*', '.'
            $best = $null
            foreach ($m in [regex]::Matches($norm, '\b(\d+\.\d+(?:\.\d+){0,2})\b')) {
              $v = $null
              if ([Version]::TryParse($m.Groups[1].Value, [ref]$v) -and $v.Major -gt 0) {
                if (-not $best -or ($v -gt $best)) { $best = $v }
              }
            }
            return $best
          }

          function Get-InnoHelpText([string]$exePath) {
            $prevPref = $ErrorActionPreference
            $out = ""
            try {
              $ErrorActionPreference = "Continue"
              $out = (& $exePath /? 2>&1 | Out-String)
              if ($null -eq $out) { $out = "" }
            } catch {
              $out = ""
            } finally {
              $ErrorActionPreference = $prevPref
              $global:LASTEXITCODE = 0
            }
            return $out
          }

          function Resolve-InnoVersion([string]$path) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) {
              return $null
            }
            $dir = Split-Path -Parent $path
            $bestVer = $null

            $peFiles = @($path)
            if (-not [string]::IsNullOrWhiteSpace($dir)) {
              $peFiles += @(
                (Join-Path $dir "ISCmplr.dll"),
                (Join-Path $dir "Compil32.exe"),
                (Join-Path $dir "ISPP.dll")
              )
            }
            foreach ($peFile in $peFiles) {
              if (-not (Test-Path -LiteralPath $peFile -PathType Leaf)) { continue }
              $item = Get-Item -LiteralPath $peFile -ErrorAction SilentlyContinue
              if (-not $item -or -not $item.VersionInfo) { continue }
              $vi = $item.VersionInfo
              $peVers = @()
              if ([int]$vi.FileMajorPart -gt 0) {
                $peVers += [Version]::new(
                  [int]$vi.FileMajorPart,
                  [Math]::Max(0, [int]$vi.FileMinorPart),
                  [Math]::Max(0, [int]$vi.FileBuildPart)
                )
              }
              if ([int]$vi.ProductMajorPart -gt 0) {
                $peVers += [Version]::new(
                  [int]$vi.ProductMajorPart,
                  [Math]::Max(0, [int]$vi.ProductMinorPart),
                  [Math]::Max(0, [int]$vi.ProductBuildPart)
                )
              }
              $peVers += ConvertTo-InnoVersion ([string]$vi.ProductVersion)
              $peVers += ConvertTo-InnoVersion ([string]$vi.FileVersion)
              foreach ($v in $peVers) {
                if ($v -and $v.Major -gt 0) {
                  if (-not $bestVer -or ($v -gt $bestVer)) { $bestVer = $v }
                  if ($v -ge [Version]"6.3") { return $v }
                }
              }
            }

            $helpText = $null
            $regPaths = @(
              "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*"
            )
            foreach ($regPath in $regPaths) {
              $parentKey = Split-Path $regPath
              if (-not (Test-Path -LiteralPath $parentKey)) { continue }
              $items = Get-ItemProperty -Path $regPath -ErrorAction SilentlyContinue |
                Where-Object { $_.DisplayName -like "Inno Setup*" }
              foreach ($item in $items) {
                $regVers = @(
                  (ConvertTo-InnoVersion ([string]$item.DisplayVersion)),
                  (ConvertTo-InnoVersion ([string]$item.DisplayName))
                )
                foreach ($v in $regVers) {
                  if ($v -and $v.Major -gt 0) {
                    $matchesCandidate = ($path -notlike "*\Chocolatey\bin\*")
                    if (-not $matchesCandidate) {
                      if ($null -eq $helpText) { $helpText = Get-InnoHelpText $path }
                      $matchesCandidate = ($helpText -match 'Inno Setup')
                    }
                    if ($matchesCandidate) {
                      if (-not $bestVer -or ($v -gt $bestVer)) { $bestVer = $v }
                      if ($v -ge [Version]"6.3") { return $v }
                    }
                  }
                }
              }
            }

            if ($null -eq $helpText) { $helpText = Get-InnoHelpText $path }
            $helpVer = ConvertTo-InnoVersion $helpText
            if ($helpVer) {
              if (-not $bestVer -or ($helpVer -gt $bestVer)) { $bestVer = $helpVer }
              if ($helpVer -ge [Version]"6.3") { return $helpVer }
            }

            if (($helpText -match 'Inno Setup') -and (Get-Command choco -ErrorAction SilentlyContinue)) {
              $prevPref = $ErrorActionPreference
              $chocoOut = ""
              $chocoOk = $false
              try {
                $ErrorActionPreference = "Continue"
                $global:LASTEXITCODE = 0
                $chocoOut = (& choco list innosetup --exact --limit-output 2>&1 | Out-String)
                $chocoOk = ($LASTEXITCODE -eq 0)
              } catch {
                $chocoOut = ""
                $chocoOk = $false
              } finally {
                $ErrorActionPreference = $prevPref
                $global:LASTEXITCODE = 0
              }
              if ($chocoOk) {
                $chocoVer = ConvertTo-InnoVersion $chocoOut
                if ($chocoVer) {
                  if (-not $bestVer -or ($chocoVer -gt $bestVer)) { $bestVer = $chocoVer }
                  if ($chocoVer -ge [Version]"6.3") { return $chocoVer }
                }
              }
            }

            return $bestVer
          }

          function Test-InnoVersion([string]$path, [switch]$Quiet) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) {
              return $false
            }
            $ver = Resolve-InnoVersion $path
            if (-not $Quiet) {
              $verLabel = if ($ver) { "version $ver" } else { "version unknown" }
              Write-Host "Found ISCC.exe at '$path' ($verLabel)"
            }
            return [bool]($ver -and ($ver -ge [Version]"6.3"))
          }

          function Find-InnoCompiler {
            $firstExisting = $null
            foreach ($candidate in @(Get-InnoCandidates)) {
              if (-not $firstExisting) { $firstExisting = $candidate }
              if (Test-InnoVersion $candidate -Quiet) {
                return $candidate
              }
              Write-Host "Skipping ISCC.exe candidate at '$candidate' (version below 6.3 or unparseable)"
            }
            return $firstExisting
          }

          $iscc = Find-InnoCompiler
          if (-not (Test-InnoVersion $iscc)) {
            if (Get-Command choco -ErrorAction SilentlyContinue) {
              if ($iscc) {
                choco upgrade innosetup -y --no-progress
                if ($LASTEXITCODE -ne 0) { throw "choco upgrade innosetup failed with exit code $LASTEXITCODE" }
              } else {
                choco install innosetup -y --no-progress
                if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with exit code $LASTEXITCODE" }
              }
            } elseif (Get-Command winget -ErrorAction SilentlyContinue) {
              if ($iscc) {
                winget upgrade --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements
                if ($LASTEXITCODE -ne 0) {
                  winget install --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements
                  if ($LASTEXITCODE -ne 0) { throw "winget install InnoSetup failed with exit code $LASTEXITCODE" }
                }
              } else {
                winget install --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements
                if ($LASTEXITCODE -ne 0) { throw "winget install InnoSetup failed with exit code $LASTEXITCODE" }
              }
            } else {
              throw "Neither choco nor winget is available to install Inno Setup >= 6.3"
            }
            $iscc = Find-InnoCompiler
          }
          if (-not (Test-InnoVersion $iscc)) {
            throw "ISCC.exe (Inno Setup >= 6.3) not found or version is below 6.3"
          }
          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = "Stop"

          function Resolve-SignTool {
            $cmd = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            $sdkRoots = @(
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe",
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\arm64\signtool.exe",
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\signtool.exe"
            )
            foreach ($pattern in $sdkRoots) {
              $found = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if ($found) { return $found.FullName }
            }
            throw "signtool.exe not found"
          }

          $pfxPath = $null
          $signtool = $null
          if (-not [string]::IsNullOrEmpty($env:WINDOWS_CERT_PFX)) {
            $signtool = Resolve-SignTool
            $pfxPath = Join-Path $env:RUNNER_TEMP "cert.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
            $signArgs = @("sign", "/f", $pfxPath)
            if (-not [string]::IsNullOrEmpty($env:WINDOWS_CERT_PASSWORD)) {
              $signArgs += @("/p", $env:WINDOWS_CERT_PASSWORD)
            }
            $signArgs += @("/fd", "SHA256", "/tr", "http://timestamp.digicert.com", "/td", "SHA256")
            & $signtool @signArgs "target\release\ruum.exe"
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on ruum.exe" }
            & $signtool @signArgs "target\release\ruum-gui.exe"
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on ruum-gui.exe" }
          }

          $stageDir = Join-Path $env:RUNNER_TEMP "win-stage"
          if (Test-Path $stageDir) { Remove-Item -Recurse -Force $stageDir }
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Force dist, $stageDir | Out-Null

          $exeAbs = (Resolve-Path "target\release\ruum.exe").Path
          $guiExeAbs = (Resolve-Path "target\release\ruum-gui.exe").Path
          $stageOutput = cargo xtask package windows-stage `
            --arch $env:ARCH `
            --out $stageDir `
            --exe $exeAbs `
            --gui-exe $guiExeAbs `
            --version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "cargo xtask package windows-stage failed" }
          $wixArchLine = $stageOutput | Where-Object { $_ -like "WIX_ARCH=*" } | Select-Object -First 1
          $wixArch = ($wixArchLine -split "=", 2)[1].Trim()

          $name = "ruum-$env:VERSION-$env:ARCH-windows"
          $zipStage = Join-Path $stageDir "zip\$name"
          New-Item -ItemType Directory -Force $zipStage | Out-Null
          Copy-Item "target\release\ruum.exe", "target\release\ruum-gui.exe", README.md, LICENSE, THIRD_PARTY_NOTICES.md $zipStage
          Compress-Archive -Path $zipStage -DestinationPath "dist\$name.zip"

          & $env:WIX_PATH build (Join-Path $stageDir "ruum.wxs") -arch $wixArch -o "dist\$name.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }

          & $env:ISCC_PATH (Join-Path $stageDir "ruum.iss")
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe failed" }
          Move-Item (Join-Path $stageDir "$name-setup.exe") "dist\$name-setup.exe"

          if ($pfxPath) {
            $signArgs = @("sign", "/f", $pfxPath)
            if (-not [string]::IsNullOrEmpty($env:WINDOWS_CERT_PASSWORD)) {
              $signArgs += @("/p", $env:WINDOWS_CERT_PASSWORD)
            }
            $signArgs += @("/fd", "SHA256", "/tr", "http://timestamp.digicert.com", "/td", "SHA256")
            foreach ($installer in @("dist\$name.msi", "dist\$name-setup.exe")) {
              & $signtool @signArgs $installer
              if ($LASTEXITCODE -ne 0) { throw "signtool failed on $installer" }
            }
            Remove-Item -Force $pfxPath
          }

          Remove-Item -Recurse -Force $stageDir

      - name: Attest artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/ruum-${{ needs.validate.outputs.version }}-${{ matrix.arch }}-windows.zip
            dist/ruum-${{ needs.validate.outputs.version }}-${{ matrix.arch }}-windows.msi
            dist/ruum-${{ needs.validate.outputs.version }}-${{ matrix.arch }}-windows-setup.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [validate, linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@v2

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums and Homebrew cask
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          REPO: ${{ github.repository }}
          MACOS_SIGNED: ${{ needs.macos.outputs.signed }}
        run: |
          cargo xtask package checksums --dir dist
          arm64_sha=$(awk '{print $1}' "dist/ruum-$VERSION-aarch64-macos.dmg.sha256")
          x64_sha=$(awk '{print $1}' "dist/ruum-$VERSION-x86_64-macos.dmg.sha256")
          cask_args=(
            --version "$VERSION"
            --arm64-sha256 "$arm64_sha"
            --x64-sha256 "$x64_sha"
            --repo "$REPO"
            --out "dist/ruum.rb"
          )
          if [ "$MACOS_SIGNED" = "true" ]; then
            cask_args+=(--signed)
          fi
          cargo xtask package homebrew-cask "${cask_args[@]}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          create_flags=(--draft --verify-tag --title "ruum $VERSION" --generate-notes)
          edit_flags=(--draft=false)
          if [[ "$TAG" == *-* ]]; then
            create_flags+=(--prerelease)
            edit_flags+=(--prerelease --latest=false)
          else
            edit_flags+=(--latest)
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              "${create_flags[@]}"
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            "${edit_flags[@]}"
          echo "::notice::Homebrew Cask (dist/ruum.rb) is published as a release asset and synced automatically by JsonLee12138/homebrew-tap (.github/workflows/sync.yml). To sync immediately, run: gh workflow run sync.yml --repo JsonLee12138/homebrew-tap"
          {
            echo "### Homebrew Cask Sync"
            echo ""
            echo "\`dist/ruum.rb\` has been uploaded to release \`$TAG\`."
            echo "[\`JsonLee12138/homebrew-tap\`](https://github.com/JsonLee12138/homebrew-tap) syncs \`Casks/ruum.rb\` automatically via \`.github/workflows/sync.yml\`."
            echo ""
            echo "To trigger sync immediately:"
            echo ""
            echo "\`\`\`sh"
            echo "gh workflow run sync.yml --repo JsonLee12138/homebrew-tap"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

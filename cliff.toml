# git-cliff configuration for Ruum (Keep-a-Changelog + Conventional Commits)

[changelog]
header = """
# Changelog

All notable changes to Ruum are documented in this file.
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^docs", group = "<!-- 3 -->Improvements" },
    { message = "^refactor", group = "<!-- 3 -->Improvements" },
    { message = "^build", group = "<!-- 4 -->Packaging & CI" },
    { message = "^ci", group = "<!-- 4 -->Packaging & CI" },
    { message = "^packaging", group = "<!-- 4 -->Packaging & CI" },
    { message = "^chore\\(release\\):", skip = true },
    { message = "^chore(\\([^)]*\\))?:", skip = true },
    { message = "^style", skip = true },
    { message = "^test", skip = true },
]
protect_breaking_commits = false
filter_commits = true
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "newest"

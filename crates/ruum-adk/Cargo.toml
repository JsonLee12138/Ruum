[package]
name = "ruum-adk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reusable direct AI model, agent, and tool execution facade built on adk-*"

[lints]
workspace = true

[features]
default = ["blocking"]
blocking = []
mcp-stdio = ["dep:adk-tool", "tokio/process"]

[dependencies]
adk-agent = { version = "2.3.0", default-features = false }
adk-core = { version = "2.3.0", features = ["rustls"] }
adk-model = { version = "2.3.0", default-features = false, features = [
    "openai",
    "anthropic",
] }
adk-runner = { version = "2.3.0", default-features = false }
adk-session = { version = "2.3.0", default-features = false }
adk-tool = { version = "2.3.0", default-features = false, features = ["mcp"], optional = true }
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "time",
    "sync",
] }
url = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

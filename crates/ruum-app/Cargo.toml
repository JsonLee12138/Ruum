[package]
name = "ruum-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GPUI treemap explorer for disk usage, in Omarchy's visual language"

[[bin]]
name = "ruum-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
gpui-kit = { version = "=0.6.6", default-features = false, features = ["assets"] }
gpui-omarchy = "0.1.3"
ruum-core = { workspace = true }
ruum-watchdog = { workspace = true }
anyhow = { workspace = true }
qrcode = { workspace = true }
serde_json = "1"
dunce = "1.0.5"
rustc-hash = { workspace = true }
tempfile = "3"
url = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSAppearance",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSRunningApplication",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "std",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSBundle",
    "NSError",
    "NSProcessInfo",
    "NSString",
    "objc2-core-services",
    "std",
] }
objc2-service-management = { version = "0.3.2", default-features = false, features = [
    "SMAppService",
    "SMErrors",
    "objc2",
    "objc2-foundation",
    "std",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_System_Registry",
] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.25", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

[dev-dependencies]
zeroize = { workspace = true }
# The window harness: it lets the tests draw a real frame and press real keys.
gpui-kit = { version = "=0.6.6", default-features = false, features = [
    "assets",
    "test-support",
] }

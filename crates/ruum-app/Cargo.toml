[package]
name = "ruum-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GPUI treemap explorer for disk usage, in Omarchy's visual language"

[[bin]]
name = "ruum"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
gpui-kit = { version = "=0.6.6", default-features = false, features = ["assets"] }
gpui-omarchy = "0.1.3"
ruum-core = { workspace = true }
anyhow = { workspace = true }
serde_json = "1"
dunce = "1.0.5"
rustc-hash = { workspace = true }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSBundle",
    "NSError",
    "NSString",
    "std",
] }
objc2-user-notifications = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
] }
windows-registry = "0.6"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.25", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
notify-rust = { version = "4", default-features = false, features = ["z"] }
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

[dev-dependencies]
# The window harness: it lets the tests draw a real frame and press real keys.
gpui-kit = { version = "=0.6.6", default-features = false, features = [
    "assets",
    "test-support",
] }

[package]
name = "ruum-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Filesystem scanning and treemap layout for ruum"

[lints]
workspace = true

[[bin]]
name = "ruum"
path = "src/bin/ruum.rs"
required-features = ["service"]

[features]
default = ["service"]
service = [
    "dep:aes-gcm",
    "dep:anyhow",
    "dep:base64",
    "dep:ed25519-dalek",
    "dep:hmac",
    "dep:interprocess",
    "dep:keyring",
    "dep:rand_core",
    "dep:rsa",
    "dep:rusqlite",
    "dep:ruum-adk",
    "dep:ruum-watchdog",
    "dep:semver",
    "dep:ssh-key",
    "dep:ureq",
    "dep:url",
    "dep:uuid",
    "dep:zeroize",
]

[dependencies]
aes-gcm = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dunce = { workspace = true }
ed25519-dalek = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
interprocess = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
rayon = { workspace = true }
rsa = { workspace = true, optional = true }
rustc-hash = { workspace = true }
rusqlite = { workspace = true, optional = true }
ruum-adk = { workspace = true, optional = true }
ruum-watchdog = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh-key = { workspace = true, optional = true }
sys-locale = { workspace = true }
tempfile = "3"
ureq = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

# rustix has no filesystem calls on Windows; `windows.rs` covers them there.
[target.'cfg(not(windows))'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
# The Recycle Bin, through the shell's own file operation.
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
winapi-util = "0.1.11"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The system trash, through NSFileManager: what Finder's Move to Trash does,
# without asking to control Finder. Only this backend is used; the crate's
# Linux and Windows code is not built.
[target.'cfg(target_os = "macos")'.dependencies]
trash = { version = "5.2.9", default-features = false }

# CPU-only sampling; the GUI dependency graph already pins this version.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
sysinfo = { version = "0.31.4", default-features = false, features = ["system"] }
